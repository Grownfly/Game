      font-family: 'Noto Serif SC', serif;

    .ink-panel {

      backdrop-filter: blur(12px);
      border: 1px solid rgba(212, 175, 55, 0.22);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }
    .ink-card {
      background: rgba(24, 30, 42, 0.78);
      border: 1px solid rgba(75, 85, 99, 0.35);
      transition: all 0.2s ease-in-out;
    }
    .ink-card:hover {
      border-color: rgba(245, 158, 11, 0.5);
      transform: translateY(-2px);
    }
    .ink-card.selected {
      border-color: #f59e0b;
      background: rgba(45, 34, 18, 0.65);
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.3);
    }

    /* 严格等阶色彩规范 */

    function rollSpiritualRootsSet() {
      const roll = Math.random();
      const elms = ['jin', 'mu', 'shui', 'huo', 'tu', 'feng', 'lei', 'bing', 'guang', 'an'];
      let values = {};
      if (roll < 0.01) {
        elms.forEach(e => values[e] = Math.floor(Math.random() * 21) + 80);
      } else if (roll < 0.06) {
        const tianElm = elms[Math.floor(Math.random() * elms.length)];
        elms.forEach(e => values[e] = (e === tianElm) ? Math.floor(Math.random() * 21) + 80 : Math.floor(Math.random() * 75));
      } else {
        const mainElm = elms[Math.floor(Math.random() * elms.length)];
        elms.forEach(e => values[e] = (e === mainElm) ? Math.floor(Math.random() * 20) + 40 : Math.floor(Math.random() * 39));
      }
      return evaluateRootDetails(values);
    }

    function evaluateRootDetails(val) {
      const elms = ['jin', 'mu', 'shui', 'huo', 'tu', 'feng', 'lei', 'bing', 'guang', 'an'];
      let maxVal = 0, tianCount = 0;
      elms.forEach(e => {
        if (val[e] > maxVal) maxVal = val[e];
        if (val[e] >= 80) tianCount++;
      });
      let grade = "杂灵根", title = "凡尘杂灵根", rate = 0.85;
      if (maxVal >= 80) {
        if (tianCount === 10) { grade = "全系天灵根"; title = "十方太初混沌至尊天道灵根"; rate = 2.5; }
        else if (tianCount > 1) { grade = "天灵根"; title = `${tianCount}系合道天灵根`; rate = 2.0; }
        else { grade = "天灵根"; title = "单绝天灵根"; rate = 1.8; }
      } else if (maxVal >= 60) {
        grade = "地灵根"; title = "紫府灵蕴地灵根"; rate = 1.45;
      } else if (maxVal >= 40) {
        grade = "真灵根"; title = "四海纯良真灵根"; rate = 1.15;
      } else {
        grade = "伪灵根"; title = "草木浮沉伪灵根"; rate = 0.95;
      }
      return { values: val, grade, title, rate, maxVal, tianCount };
    }

    function evalDiscipleRank(root, stats) {
      let score = root.maxVal * 0.7 + (root.tianCount * 15) + (stats.comp * 0.3);
      if (root.tianCount >= 1 || score >= 85) return { rank: "亲传弟子", tierName: "天阶", score: Math.floor(score) };
      if (score >= 60 || root.grade === "地灵根") return { rank: "内门弟子", tierName: "地阶", score: Math.floor(score) };
      if (score >= 35 || root.grade === "真灵根") return { rank: "外门弟子", tierName: "玄阶", score: Math.floor(score) };
      return { rank: "杂役弟子", tierName: "黄阶", score: Math.floor(score) };
    }

    function chooseSect(sectId) {
      gameState.player.sectId = sectId;

      gameState.player.baseDiscipleRank = (sectId === 'rogue') ? '散修游侠' : evalRes.rank;
      gameState.player.sectRank = gameState.player.baseDiscipleRank;
      
      let tierName = "黄阶";
      if (gameState.player.sectRank === "外门弟子") tierName = "玄阶";
      else if (gameState.player.sectRank === "内门弟子") tierName = "地阶";
      else if (gameState.player.sectRank === "亲传弟子") tierName = "天阶";
      if (sectId === 'rogue') tierName = "玄阶";

      gameState.stage = 'path';
      rollPathChoices(sectId, tierName);
      renderStage();

    function rollPathChoices(sectId, allowedTierName) {
      const p = gameState.player;
      let mPool = UNIQUE_MANUALS_DATABASE.filter(m => m.tier.name === allowedTierName && !p.acquiredManuals[m.name]);
      if(mPool.length === 0) mPool = UNIQUE_MANUALS_DATABASE.filter(m => !p.acquiredManuals[m.name]);
      if(mPool.length === 0) mPool = UNIQUE_MANUALS_DATABASE;

      let sPool = UNIQUE_SKILLS_DATABASE.filter(s => s.tier.name === allowedTierName && !p.acquiredSkills[s.name]);
      if(sPool.length === 0) sPool = UNIQUE_SKILLS_DATABASE.filter(s => !p.acquiredSkills[s.name]);
      if(sPool.length === 0) sPool = UNIQUE_SKILLS_DATABASE;

      gameState.tempPathChoices.manuals = [...mPool].sort(() => 0.5 - Math.random()).slice(0, 3);
      gameState.tempPathChoices.skills = [...sPool].sort(() => 0.5 - Math.random()).slice(0, 3);
      gameState.pathManualIdx = 0;
      gameState.pathSkillIdx = 0;
    }

    function getPlayerStats() {
      const p = gameState.player;
      const baseRealm = REALMS[p.realmIdx] || REALMS[0];
      let comp = p.baseComp, luck = p.baseLuck, phys = p.basePhys, charm = p.baseCharm;
      p.traits.forEach(t => { comp += (t.comp||0); luck += (t.luck||0); phys += (t.phys||0); charm += (t.charm||0); });
      
      let bHp = 0, bMp = 0, bAtk = 0, bDef = 0;
      
      Object.keys(p.acquiredManuals).forEach(mKey => {
        const entry = p.acquiredManuals[mKey];
        const rankMult = MASTERY_RANKS[entry.rankIdx].mult;
        bAtk += Math.floor((entry.manualObj.atk || 0) * rankMult);
        bDef += Math.floor((entry.manualObj.def || 0) * rankMult);
        bHp  += Math.floor((entry.manualObj.hp || 0) * rankMult);
      });

      p.equipWeapons.forEach(w => { bAtk += w.atk||0; bDef += w.def||0; });
      p.equipArmors.forEach(a => { bDef += a.def||0; bHp += a.hp||0; });
      p.equipAccessories.forEach(a => { bAtk += a.atk||0; bDef += a.def||0; bHp += a.hp||0; });
      p.equipBeasts.forEach(b => { bAtk += b.atk||0; bDef += b.def||0; bHp += b.hp||0; });

      return {
        comp, luck, phys, charm,
        maxHp: baseRealm.hpMax + bHp + (phys * 20),
        maxMp: baseRealm.mpMax + bMp + (comp * 15),
        atk: baseRealm.atk + bAtk + Math.floor(phys * 1.5),
        def: baseRealm.def + bDef + Math.floor(phys * 1.2),
        combatPower: Math.floor((baseRealm.atk+bAtk)*3.5 + (baseRealm.def+bDef)*2.8 + (baseRealm.hpMax+bHp)*0.4)
      };
    }

    function getTotalMaxAge() {
      const p = gameState.player;
      const rName = REALMS[p.realmIdx].name;
      let base = 120;
      if (rName.startsWith("筑基")) base = 250;
      else if (rName.startsWith("金丹")) base = 500;
      else if (rName.startsWith("元婴")) base = 1200;
      else if (rName.startsWith("化神")) base = 3000;
      if (rName.includes("飞升")) base = 5000;

      let fateBonus = 0;
      p.traits.forEach(t => { fateBonus += (t.bonusAge || 0); });
      return base + (p.extraLifespan || 0) + fateBonus;
    }

    function updatePlayerSectRank() {
      const p = gameState.player;
      const rName = REALMS[p.realmIdx].name;
      if (rName.startsWith("练气")) {
        p.sectRank = p.baseDiscipleRank || "外门弟子";
      } else if (rName.startsWith("筑基")) {
        p.sectRank = p.sectId === 'rogue' ? "散修客卿" : "外门长老";
      } else if (rName.startsWith("金丹")) {
        p.sectRank = p.sectId === 'rogue' ? "散修名宿" : "内门长老";
      } else if (rName.startsWith("元婴")) {
        p.sectRank = p.sectId === 'rogue' ? "八荒巨擘" : "掌门宗主";
      } else if (rName.startsWith("化神")) {
        p.sectRank = p.sectId === 'rogue' ? "陆地真仙" : "太上老祖";
      }
    }

    function getSectRankBenefits(rank) {
      if (rank === "杂役弟子") return { stip: 10, spd: 0 };
      if (rank === "外门弟子" || rank === "散修游侠") return { stip: 30, spd: 20 };
      if (rank === "内门弟子") return { stip: 80, spd: 55 };
      if (rank === "亲传弟子") return { stip: 200, spd: 100 };
      if (rank.includes("长老") || rank === "散修客卿" || rank === "散修名宿") return { stip: 500, spd: 180 };
      if (rank.includes("宗主") || rank === "八荒巨擘") return { stip: 3200, spd: 450 };
      if (rank.includes("老祖") || rank === "陆地真仙") return { stip: 8888, spd: 680 };
      return { stip: 30, spd: 20 };
    }

    function passTime(months) {
      const p = gameState.player;
      updatePlayerSectRank();
      const stip = Math.floor(getSectRankBenefits(p.sectRank).stip * (months / 12));
      p.spiritStones += stip;
      p.month = (p.month || 0) + months;
      
      Object.keys(p.acquiredManuals).forEach(mKey => {
        const entry = p.acquiredManuals[mKey];
        if (entry.rankIdx < MASTERY_RANKS.length - 1) {
          entry.exp += months * 5;
          const req = MASTERY_RANKS[entry.rankIdx].req;
          if (entry.exp >= req) {
            entry.exp = 0;
            entry.rankIdx++;
            addLog(`功法《${mKey}》感悟突破至【${MASTERY_RANKS[entry.rankIdx].name}】境界！`, "【功法精进】");
          }
        }
      });

      while (p.month >= 12) {
        p.month -= 12;
        p.age += 1;
        if (p.age >= getTotalMaxAge()) {
          showModal("寿元耗尽", "大限已至，肉身化入虚无，兵解轮回。");
          return;
        }
      }
    }

      const raw = localStorage.getItem("immortal_journey_v12");

        if(!gameState.player.inventory.pills) gameState.player.inventory.pills = {};

        if(!gameState.player.inventory.manualBooks) gameState.player.inventory.manualBooks = [];
        if(!gameState.player.inventory.craftBooks) gameState.player.inventory.craftBooks = [];

    function generateMarketStock() {
      const p = gameState.player;
      const ownedWeaponNames = new Set([...p.inventory.weapons.map(w=>w.name), ...p.equipWeapons.map(w=>w.name)]);
      const ownedArmorNames = new Set([...p.inventory.armors.map(a=>a.name), ...p.equipArmors.map(a=>a.name)]);
      const ownedAccNames = new Set([...p.inventory.accessories.map(a=>a.name), ...p.equipAccessories.map(a=>a.name)]);
      const ownedManualNames = new Set(Object.keys(p.acquiredManuals));
      const ownedSkillNames = new Set(Object.keys(p.acquiredSkills));

      let pool = [];

      WEAPONS_DATABASE.forEach(w => { if(!ownedWeaponNames.has(w.name)) pool.push({ type: 'weapon', item: w, price: w.price, tier: w.tier.name }); });
      ARMORS_DATABASE.forEach(a => { if(!ownedArmorNames.has(a.name)) pool.push({ type: 'armor', item: a, price: a.price, tier: a.tier.name }); });
      ACCESSORIES_DATABASE.forEach(ac => { if(!ownedAccNames.has(ac.name)) pool.push({ type: 'accessory', item: ac, price: ac.price, tier: ac.tier.name }); });
      
      Object.keys(PILLS_DATABASE).forEach(k => { pool.push({ type: 'pill', item: PILLS_DATABASE[k], price: PILLS_DATABASE[k].price, tier: PILLS_DATABASE[k].tier.name }); });
      BEASTS_DATABASE.forEach(b => { pool.push({ type: 'beast', item: b, price: b.price, tier: b.tier.name }); });
      
      UNIQUE_MANUALS_DATABASE.forEach(m => {
        if(!ownedManualNames.has(m.name) && !p.inventory.manualBooks.some(b=>b.name===m.name)) {
          pool.push({ type: 'manualBook', item: m, price: Math.floor(m.atk * 35), tier: m.tier.name });
        }
      });
      UNIQUE_SKILLS_DATABASE.forEach(s => {
        if(!ownedSkillNames.has(s.name) && !p.inventory.skillBooks.some(b=>b.name===s.name)) {
          pool.push({ type: 'skillBook', item: s, price: Math.floor(s.power * 25), tier: s.tier.name });
        }
      });
      
      const craftTypes = [
        { key: 'alchemy', name: '炼丹术传承秘籍' },
        { key: 'forging', name: '铸器术传承秘籍' },
        { key: 'planting', name: '灵植术传承秘籍' },
        { key: 'talisman', name: '符箓术传承秘籍' },
        { key: 'formation', name: '阵法术传承秘籍' },
        { key: 'beast', name: '御兽术传承秘籍' }
      ];
      craftTypes.forEach(ct => {
        if(!p.crafts[ct.key].learned && !p.inventory.craftBooks.some(b=>b.craftKey===ct.key)) {
          pool.push({ type: 'craftBook', item: { name: ct.name, craftKey: ct.key, desc: `习得修仙六艺之${ct.name.replace('传承秘籍','')}` }, price: 1500, tier: '玄阶' });
        }
      });

      pool.sort(() => 0.5 - Math.random());
      gameState.marketStock = pool.slice(0, 10).map((obj, idx) => ({ ...obj, id: `m_${idx}_${Date.now()}`, sold: false }));
    }

    function buyMarketItem(marketId) {
      const p = gameState.player;
      const target = gameState.marketStock.find(m => m.id === marketId);
      if (!target || target.sold) return;
      if (p.spiritStones < target.price) { showModal("灵石不足", `购买【${target.item.name}】需 ${target.price} 灵石。`); return; }

      p.spiritStones -= target.price;
      target.sold = true;

      if (target.type === 'weapon') p.inventory.weapons.push(JSON.parse(JSON.stringify(target.item)));
      else if (target.type === 'armor') p.inventory.armors.push(JSON.parse(JSON.stringify(target.item)));
      else if (target.type === 'accessory') p.inventory.accessories.push(JSON.parse(JSON.stringify(target.item)));
      else if (target.type === 'pill') {
        const pKey = Object.keys(PILLS_DATABASE).find(k => PILLS_DATABASE[k].name === target.item.name);
        if (pKey) p.inventory.pills[pKey] = (p.inventory.pills[pKey]||0) + 1;
      }
      else if (target.type === 'beast') p.inventory.beasts.push(JSON.parse(JSON.stringify(target.item)));
      else if (target.type === 'manualBook') p.inventory.manualBooks.push(JSON.parse(JSON.stringify(target.item)));
      else if (target.type === 'skillBook') p.inventory.skillBooks.push(JSON.parse(JSON.stringify(target.item)));
      else if (target.type === 'craftBook') p.inventory.craftBooks.push(JSON.parse(JSON.stringify(target.item)));

      addLog(`在大道坊市购得【${target.item.name}】。`, "【坊市】");
      renderStage();
    }

    function refreshMarket() {
      const p = gameState.player;
      if (p.spiritStones < 100) { showModal("灵石不足", "刷新坊市库存需消耗 100 灵石。"); return; }
      p.spiritStones -= 100;
      generateMarketStock();
      addLog("消耗 100 灵石刷新大道坊市库存。", "【坊市】");
      renderStage();
    }

    function doMeditate() {
      const p = gameState.player;
      const stats = getPlayerStats();
      const spd = 1 + getSectRankBenefits(p.sectRank).spd / 100;
      const gain = Math.floor((14 + stats.comp * 1.6) * (p.root ? p.root.rate : 1) * spd);
      p.exp += gain;
      p.mp = Math.min(stats.maxMp, p.mp + 25);
      p.hp = Math.min(stats.maxHp, p.hp + 15);
      passTime(1);
      addLog(`静坐调息1个月，真元修为 +${gain}`, "【打坐】");
      renderStage();
    }

    function doSeclusion() {
      const p = gameState.player;
      if (p.mp < 40) { showModal("法力匮乏", "闭关定修需消耗40点法力。"); return; }
      p.mp -= 40;
      const stats = getPlayerStats();
      const spd = 1 + getSectRankBenefits(p.sectRank).spd / 100;
      const gain = Math.floor((180 + stats.comp * 22) * (p.root ? p.root.rate : 1) * spd);
      p.exp += gain;
      passTime(12);
      addLog(`深层闭关1载，真元修为暴增 +${gain}`, "【闭关】");
      renderStage();
    }

    function doAdventure() {
      const p = gameState.player;
      const stats = getPlayerStats();
      passTime(2);
      const roll = Math.random();

      if (roll < 0.20) {
        const dmg = Math.floor(stats.maxHp * 0.22);
        p.hp = Math.max(1, p.hp - dmg);
        const expLoss = Math.floor(REALMS[p.realmIdx].reqExp * 0.20);
        p.exp = Math.max(0, p.exp - expLoss);
        addLog(`游历八荒遭遇凶兽伏击负伤，气血 -${dmg}，修为反噬损耗 -${expLoss}`, "【负伤】");
      } else if (roll < 0.40) {
        const unownedFates = FATE_TRAITS_DATABASE.filter(f => f.tier !== '负面' && f.tier !== '非常负面' && !p.traits.some(t => t.name === f.name));
        if (unownedFates.length > 0) {
          const newTrait = unownedFates[Math.floor(Math.random() * unownedFates.length)];
          p.traits.push(JSON.parse(JSON.stringify(newTrait)));
          addLog(`八荒历练顿悟觉醒正向命格【${newTrait.name}】（${newTrait.desc}）！`, "【命格顿悟】");
        } else {
          p.spiritStones += 3000;
          addLog("历练偶得古修遗留灵石 3000 枚。", "【历练】");
        }
      } else if (roll < 0.60) {
        if (Math.random() < 0.35 && p.realmIdx < REALMS.length - 1) {
          p.realmIdx++;
          p.exp = 0;
          updatePlayerSectRank();
          p.hp = stats.maxHp;
          p.mp = stats.maxMp;
          addLog(`【逆天造化】游历太古秘境吞服绝品仙果，直接原地突破至【${REALMS[p.realmIdx].name}】！`, "【直接突破】");
          triggerMajorBreakthroughReward();
        } else {
          const stoneGain = 2500 + Math.floor(Math.random() * 3500);
          p.spiritStones += stoneGain;
          addLog(`历练寻得遗迹宝库，收获大量灵石 ${stoneGain} 枚。`, "【横财】");
        }
      } else if (roll < 0.80) {
        if (Math.random() < 0.5) {
          const elms = ['jin', 'mu', 'shui', 'huo', 'tu', 'feng', 'lei', 'bing', 'guang', 'an'];
          const elmKey = elms[Math.floor(Math.random() * elms.length)];
          const curVal = p.root.values[elmKey] || 40;
          if (curVal < 100) {
            const inc = Math.floor(Math.random() * 6) + 3;
            p.root.values[elmKey] = Math.min(100, curVal + inc);
            p.root = evaluateRootDetails(p.root.values);
            addLog(`参悟天地造化，【${ELEMENT_CONFIG[elmKey].name}灵根】资质提升 +${inc}（当前：${p.root.values[elmKey]}）！`, "【灵根精进】");
          } else {
            p.spiritStones += 2000;
            addLog("灵根已至大圆满，偶得灵石 2000 枚。", "【历练】");
          }
        } else {
          const statsList = ['baseComp', 'baseLuck', 'basePhys', 'baseCharm'];
          const sKey = statsList[Math.floor(Math.random() * statsList.length)];
          const statNames = { baseComp: '悟性', baseLuck: '幸运', basePhys: '体质', baseCharm: '颜值' };
          const curVal = p[sKey] || 10;
          if (curVal < 100) {
            const inc = Math.floor(Math.random() * 5) + 2;
            p[sKey] = Math.min(100, curVal + inc);
            addLog(`历练灌顶，四维【${statNames[sKey]}】增加 +${inc}（当前：${p[sKey]}）！`, "【四维蜕变】");
          } else {
            p.spiritStones += 2000;
            addLog("四维已至圆满，偶得灵石 2000 枚。", "【历练】");
          }
        }
      } else {
        const subR = Math.random();
        if (subR < 0.2) {
          const pKeys = Object.keys(PILLS_DATABASE);
          const pKey = pKeys[Math.floor(Math.random() * pKeys.length)];
          p.inventory.pills[pKey] = (p.inventory.pills[pKey]||0) + 1;
          addLog(`历练寻得仙丹【${PILLS_DATABASE[pKey].name}】已入库！`, "【奇遇得宝】");
        } else if (subR < 0.4) {
          const w = WEAPONS_DATABASE[Math.floor(Math.random() * WEAPONS_DATABASE.length)];
          p.inventory.weapons.push(JSON.parse(JSON.stringify(w)));
          addLog(`历练寻得神兵【${w.name}】入库！`, "【奇遇神兵】");
        } else if (subR < 0.6) {
          const a = ARMORS_DATABASE[Math.floor(Math.random() * ARMORS_DATABASE.length)];
          p.inventory.armors.push(JSON.parse(JSON.stringify(a)));
          addLog(`历练寻得护甲【${a.name}】入库！`, "【奇遇护甲】");
        } else if (subR < 0.8) {
          const ac = ACCESSORIES_DATABASE[Math.floor(Math.random() * ACCESSORIES_DATABASE.length)];
          p.inventory.accessories.push(JSON.parse(JSON.stringify(ac)));
          addLog(`历练寻得饰品【${ac.name}】入库！`, "【奇遇饰品】");
        } else {
          const beast = BEASTS_DATABASE[Math.floor(Math.random() * BEASTS_DATABASE.length)];
          p.inventory.beasts.push(JSON.parse(JSON.stringify(beast)));
          addLog(`历练降服神兽【${beast.name}】收入灵兽笼！`, "【奇遇御兽】");
        }
      }
      renderStage();
    }

    function calculateBreakthroughRate() {
      const p = gameState.player;
      const stats = getPlayerStats();
      let rate = 0.58 + (stats.comp * 0.007) + ((p.inventory.pills.p_d1||0)>0?0.25:0) + ((p.inventory.pills.p_t1||0)>0?0.35:0);
      return Math.min(0.98, Math.max(0.35, rate));
    }

    function doBreakthrough() {
      const p = gameState.player;
      const cur = REALMS[p.realmIdx];
      if (!cur || p.realmIdx >= REALMS.length - 1) return;
      if (p.exp < cur.reqExp) { showModal("修为不足", `冲击【${REALMS[p.realmIdx+1].name}】需修为 ${cur.reqExp}，当前 ${p.exp}`); return; }
      
      let rate = calculateBreakthroughRate();
      if ((p.inventory.pills.p_d1||0) > 0) p.inventory.pills.p_d1--;
      else if ((p.inventory.pills.p_t1||0) > 0) p.inventory.pills.p_t1--;

      if (Math.random() < rate) {
        p.exp -= cur.reqExp;
        p.realmIdx++;
        updatePlayerSectRank();
        const stats = getPlayerStats();
        p.hp = stats.maxHp;
        p.mp = stats.maxMp;
        addLog(`雷劫大作，成功破境晋升至【${REALMS[p.realmIdx].name}】！`, "【突破成功】");
        triggerMajorBreakthroughReward();
      } else {
        const expLoss = Math.floor(cur.reqExp / 3);
        p.exp = Math.max(0, p.exp - expLoss);
        const stats = getPlayerStats();
        p.hp = Math.max(1, p.hp - Math.floor(stats.maxHp * 0.35));
        addLog(`渡劫失败遭心魔反噬，真元溃散，修为扣除 1/3 (-${expLoss})！`, "【突破失败】");
        showModal("雷劫反噬", `冲击境界失败！真元反冲导致气血受损，并被剥夺当前阶段 1/3 的修为（-${expLoss}）。`);
      }
      renderStage();
    }

    function triggerMajorBreakthroughReward() {
      const p = gameState.player;
      const rName = REALMS[p.realmIdx].name;
      let targetTierName = "黄阶";
      if (rName.startsWith("筑基")) targetTierName = "玄阶";
      else if (rName.startsWith("金丹")) targetTierName = "地阶";
      else if (rName.startsWith("元婴") || rName.startsWith("化神")) targetTierName = "天阶";

      let sPool = UNIQUE_SKILLS_DATABASE.filter(s => s.tier.name === targetTierName && !p.acquiredSkills[s.name]);
      if(sPool.length === 0) sPool = UNIQUE_SKILLS_DATABASE.filter(s => !p.acquiredSkills[s.name]);

      const combined = sPool.sort(() => 0.5 - Math.random()).slice(0, 3);

      if (combined.length > 0) {
        window._breakthroughChoices = combined;
        let html = `<div class="space-y-2">破境成功！天降道韵，宗门藏经阁特许晋升，任选一门【${targetTierName}】本派武技：<div class="grid grid-cols-1 gap-2 mt-2">`;
        combined.forEach((s, idx) => {
          html += `<button onclick="claimMajorRewardChoice(${idx})" class="p-2 bg-stone-900 border border-amber-500/50 rounded text-amber-300 hover:bg-stone-800 text-xs text-left">⚔️ 参悟武技《${s.name}》（${s.tier.name}·威力${s.power}）</button>`;
        });
        html += `</div></div>`;
        showModal("宗门破境传承大典", html);
      } else {
        p.spiritStones += 5000;
        showModal("宗门嘉奖", "破境圆满！该阶武技已全部学满，宗门特赐 5000 灵石以资鼓励。");
      }
    }

    function claimMajorRewardChoice(idx) {
      if (window._breakthroughChoices && window._breakthroughChoices[idx]) {
        const chosen = window._breakthroughChoices[idx];
        const p = gameState.player;
        if(!p.acquiredSkills[chosen.name]) {
          p.acquiredSkills[chosen.name] = { exp: 0, rankIdx: 0, skillObj: chosen };
        }
        addLog(`破境机缘触发，习得武技【${chosen.name}】！`, "【传承】");
        closeModal();
        window._breakthroughChoices = null;
        renderStage();
      }
    }

    function getMaxCraftLevel(realmIdx) {
      if (realmIdx < 9) return 1;
      if (realmIdx < 13) return 2;
      if (realmIdx < 17) return 3;
      if (realmIdx < 21) return 4;
      return 5;
    }

    function doCraftAction(id) {
      const p = gameState.player;
      const c = p.crafts[id];
      if (!c || !c.learned) { showModal("技艺未掌握", "请先在大道坊市购置并研习对应技艺技能书，方可开炉演练。"); return; }
      if (p.mp < 25) { showModal("法力匮乏", "开炉演练百艺需消耗 25 点法力。"); return; }
      p.mp -= 25;
      passTime(1);

      const maxAllowed = getMaxCraftLevel(p.realmIdx);
      if (c.level < maxAllowed) {
        c.exp += 30;
        if (c.exp >= c.level * 60) {
          c.exp = 0;
          c.level = Math.min(5, c.level + 1);
          addLog(`百艺突破！【${id}】造诣晋升至第 ${c.level} 重！`, "【百艺】");
        }
      } else {
        c.exp += 15;
      }

      if (id === 'alchemy') {
        const pKeys = Object.keys(PILLS_DATABASE);
        const randKey = pKeys[Math.floor(Math.random() * pKeys.length)];
        p.inventory.pills[randKey] = (p.inventory.pills[randKey]||0) + 1;
        addLog(`炼丹成功！获得【${PILLS_DATABASE[randKey].name}】已存入随身灵丹阁。`, "【百艺】");
      } else if (id === 'forging') {
        const t = Math.random();
        let craftedItem, targetInventory;
        if (t < 0.33) {
          craftedItem = WEAPONS_DATABASE[Math.floor(Math.random() * WEAPONS_DATABASE.length)];
          targetInventory = p.inventory.weapons;
        } else if (t < 0.66) {
          craftedItem = ARMORS_DATABASE[Math.floor(Math.random() * ARMORS_DATABASE.length)];
          targetInventory = p.inventory.armors;
        } else {
          craftedItem = ACCESSORIES_DATABASE[Math.floor(Math.random() * ACCESSORIES_DATABASE.length)];
          targetInventory = p.inventory.accessories;
        }
        targetInventory.push(JSON.parse(JSON.stringify(craftedItem)));
        addLog(`铸器成功！锻造出【${craftedItem.name}】已放入装备行囊。`, "【百艺】");
      } else if (id === 'planting') {
        p.spiritStones += 300;
        addLog("灵植园灵药成熟，获灵石 300 枚。", "【百艺】");
      } else if (id === 'talisman') {
        p.inventory.talismans.push({ name: "太乙护身神符", tier: TIERS.x_up, desc: "护身辟邪" });
        if(Math.random()<0.08) {
          const unowned = FATE_TRAITS_DATABASE.find(f => f.tier !== '负面' && f.tier !== '非常负面' && !p.traits.some(t => t.name === f.name));
          if(unowned) {
            p.traits.push(JSON.parse(JSON.stringify(unowned)));
            addLog(`画符引发天地异象，顿悟觉醒正向命格【${unowned.name}】！`, "【命格顿悟】");
          }
        }
        addLog("画符成功，获得【太乙护身神符】入库。", "【百艺】");
      } else if (id === 'formation') {
        p.inventory.formations.push({ name: "两仪微尘阵盘", tier: TIERS.x_up, desc: "聚灵护法" });
        if(Math.random()<0.08) {
          const unowned = FATE_TRAITS_DATABASE.find(f => f.tier !== '负面' && f.tier !== '非常负面' && !p.traits.some(t => t.name === f.name));
          if(unowned) {
            p.traits.push(JSON.parse(JSON.stringify(unowned)));
            addLog(`阵法感悟大道鸿蒙，顿悟觉醒正向命格【${unowned.name}】！`, "【命格顿悟】");
          }
        }
        addLog("阵法铭刻成功，获得【两仪微尘阵盘】入库。", "【百艺】");
      } else if (id === 'beast') {
        const beast = BEASTS_DATABASE[Math.floor(Math.random() * BEASTS_DATABASE.length)];
        p.inventory.beasts.push(JSON.parse(JSON.stringify(beast)));
        addLog(`御兽驯化成功！捕获神兽【${beast.name}】入灵兽笼。`, "【御兽】");
      }
      renderStage();
    }

    function recycleItem(type, idx) {
      const p = gameState.player;
      let item = null;
      let refund = 200;
      if (type === 'weapon') {
        item = p.inventory.weapons.splice(idx, 1)[0];
        refund = Math.floor((item.price || 1000) * 0.3);
      } else if (type === 'armor') {
        item = p.inventory.armors.splice(idx, 1)[0];
        refund = Math.floor((item.price || 1000) * 0.3);
      } else if (type === 'accessory') {
        item = p.inventory.accessories.splice(idx, 1)[0];
        refund = Math.floor((item.price || 1000) * 0.3);
      } else if (type === 'pill') {
        const pKey = Object.keys(p.inventory.pills)[idx];
        if (pKey) {
          p.inventory.pills[pKey]--;
          if(p.inventory.pills[pKey] <= 0) delete p.inventory.pills[pKey];
          refund = 50;
          item = { name: PILLS_DATABASE[pKey].name };
        }
      }
      if (item) {
        p.spiritStones += refund;
        addLog(`回收【${item.name}】成功，折算获得 ${refund} 灵石。`, "【回收】");
        renderStage();
      }
    }

    function usePill(pKey) {
      const p = gameState.player;
      if (!p.inventory.pills[pKey] || p.inventory.pills[pKey] <= 0) return;
      p.inventory.pills[pKey]--;
      if (p.inventory.pills[pKey] <= 0) delete p.inventory.pills[pKey];

      const pill = PILLS_DATABASE[pKey];
      if (pill.hpMax) {
        p.extraLifespan = (p.extraLifespan || 0) + (pill.age || 0);
        addLog(`服用【${pill.name}】，气血大增，寿元增加 ${pill.age||0} 载！`, "【服丹】");
      } else if (pill.comp) {
        p.baseComp += pill.comp;
        p.baseLuck += pill.luck;
        p.basePhys += pill.phys;
        p.baseCharm += pill.charm;
        addLog(`服用【${pill.name}】，脱胎换骨，四维全属性大幅提升！`, "【服丹】");
      } else if (pill.exp) {
        p.exp += pill.exp;

    function startHoldAction(actionType, e) {
      if(e) e.preventDefault();
      if (holdTimer) clearTimeout(holdTimer);
      if (holdInterval) clearInterval(holdInterval);

      if (actionType === 'meditate') doMeditate();
      else if (actionType === 'adventure') doAdventure();

      holdTimer = setTimeout(() => {
        holdInterval = setInterval(() => {
          if (actionType === 'meditate') doMeditate();
          else if (actionType === 'adventure') doAdventure();
        }, 300);
      }, 500);
    }

    function stopHoldAction(e) {
      if(e) e.preventDefault();
      if (holdTimer) clearTimeout(holdTimer);
      if (holdInterval) clearInterval(holdInterval);
      holdTimer = null;
      holdInterval = null;
    }

                        <span class="text-xs text-stone-400">${c.learned ? `第 ${c.level} / 5 重` : '❌ 未掌握'}</span>
                      </div>
                      <div class="w-full bg-stone-900 h-2 rounded overflow-hidden border border-stone-800 mb-2">
                        <div class="bg-amber-500 h-full rounded" style="width:${c.learned ? Math.min(100, Math.floor((c.exp/reqExp)*100)) : 0}%"></div>
                      </div>
                    </div>
                    <button onclick="doCraftAction('${k}')" class="w-full py-2 ${c.learned ? 'bg-stone-800 hover:bg-stone-700 text-amber-200' : 'bg-stone-900 text-stone-600 cursor-not-allowed'} rounded-lg text-xs font-bold border border-stone-700 transition">
                      ${c.learned ? '开炉演练 / 产出物品' : '需购置技艺技能书研习'}
                    </button>
                  </div>`;
              }).join('')}
            </div>
          </div>`;
      } else if (gameState.mainTab === 'equip') {
        tabContent = `
          <div class="space-y-4">
            <div class="ink-panel p-4 rounded-xl border border-stone-800 space-y-3">
              <h4 class="text-xs font-bold text-amber-300 border-b border-stone-800 pb-1">⚔️ 当前随身装备配置与具体加成</h4>
              <div class="grid grid-cols-1 sm:grid-cols-4 gap-2 text-xs">
                <div class="bg-stone-900 p-2.5 rounded border border-stone-800">
                  <div class="text-[10px] text-stone-400 mb-1">本命神兵 (${p.equipWeapons.length}/2)</div>
                  ${p.equipWeapons.map((w,i)=>`<div class="${w.tier.colorClass} font-bold truncate">${w.name} (攻+${w.atk} 防+${w.def}) <button onclick="unequipItem('weapon',${i})" class="text-red-400 text-[10px] ml-1">[卸下]</button></div>`).join('') || '<span class="text-stone-600">未装备</span>'}
                </div>
                <div class="bg-stone-900 p-2.5 rounded border border-stone-800">
                  <div class="text-[10px] text-stone-400 mb-1">护体道甲 (${p.equipArmors.length}/2)</div>
                  ${p.equipArmors.map((a,i)=>`<div class="${a.tier.colorClass} font-bold truncate">${a.name} (防+${a.def} 血+${a.hp}) <button onclick="unequipItem('armor',${i})" class="text-red-400 text-[10px] ml-1">[卸下]</button></div>`).join('') || '<span class="text-stone-600">未装备</span>'}
                </div>
                <div class="bg-stone-900 p-2.5 rounded border border-stone-800">
                  <div class="text-[10px] text-stone-400 mb-1">通灵佩饰 (${p.equipAccessories.length}/10)</div>
                  ${p.equipAccessories.map((ac,i)=>`<div class="${ac.tier.colorClass} font-bold truncate">${ac.name} (攻+${ac.atk||0} 防+${ac.def||0}) <button onclick="unequipItem('accessory',${i})" class="text-red-400 text-[10px] ml-1">[卸下]</button></div>`).join('') || '<span class="text-stone-600">未装备</span>'}
                </div>
                <div class="bg-stone-900 p-2.5 rounded border border-stone-800">
                  <div class="text-[10px] text-stone-400 mb-1">随行神兽 (${p.equipBeasts.length}/2)</div>
                  ${p.equipBeasts.map((b,i)=>`<div class="${b.tier.colorClass} font-bold truncate">${b.name} (攻+${b.atk} 防+${b.def}) <button onclick="unequipItem('beast',${i})" class="text-red-400 text-[10px] ml-1">[收回]</button></div>`).join('') || '<span class="text-stone-600">未携带</span>'}
                </div>
              </div>
            </div>

            <div class="ink-panel p-4 rounded-xl border border-stone-800 space-y-3">
              <h4 class="text-xs font-bold text-amber-300 border-b border-stone-800 pb-1">🎒 纳戒储物袋与装备回收</h4>
              <div class="grid grid-cols-1 sm:grid-cols-4 gap-3 text-xs">
                <div class="bg-stone-900 p-3 rounded border border-stone-800 space-y-2">
                  <div class="font-bold text-amber-200">神兵武器库</div>
                  <div class="space-y-1.5 max-h-40 overflow-y-auto">
                    ${p.inventory.weapons.map((w,i)=>`<div class="flex justify-between items-center bg-stone-950 p-1.5 rounded"><div><span class="${w.tier.colorClass}">${w.name}</span> <span class="text-[9px] text-stone-400">(攻+${w.atk})</span></div><div class="space-x-1"><button onclick="equipItem('weapon',${i})" class="px-2 py-0.5 bg-stone-800 hover:bg-stone-700 rounded text-[10px]">装备</button><button onclick="recycleItem('weapon',${i})" class="px-2 py-0.5 bg-red-900 hover:bg-red-800 rounded text-[10px] text-white">回收</button></div></div>`).join('') || '<span class="text-[10px] text-stone-500">无备用武器</span>'}
                  </div>
                </div>
                <div class="bg-stone-900 p-3 rounded border border-stone-800 space-y-2">
                  <div class="font-bold text-emerald-300">护体道甲库</div>
                  <div class="space-y-1.5 max-h-40 overflow-y-auto">
                    ${p.inventory.armors.map((a,i)=>`<div class="flex justify-between items-center bg-stone-950 p-1.5 rounded"><div><span class="${a.tier.colorClass}">${a.name}</span> <span class="text-[9px] text-stone-400">(防+${a.def})</span></div><div class="space-x-1"><button onclick="equipItem('armor',${i})" class="px-2 py-0.5 bg-stone-800 hover:bg-stone-700 rounded text-[10px]">装备</button><button onclick="recycleItem('armor',${i})" class="px-2 py-0.5 bg-red-900 hover:bg-red-800 rounded text-[10px] text-white">回收</button></div></div>`).join('') || '<span class="text-[10px] text-stone-500">无备用道甲</span>'}
                  </div>
                </div>
                <div class="bg-stone-900 p-3 rounded border border-stone-800 space-y-2">
                  <div class="font-bold text-sky-300">通灵佩饰库</div>
                  <div class="space-y-1.5 max-h-40 overflow-y-auto">
                    ${p.inventory.accessories.map((ac,i)=>`<div class="flex justify-between items-center bg-stone-950 p-1.5 rounded"><div><span class="${ac.tier.colorClass}">${ac.name}</span></div><div class="space-x-1"><button onclick="equipItem('accessory',${i})" class="px-2 py-0.5 bg-stone-800 hover:bg-stone-700 rounded text-[10px]">佩戴</button><button onclick="recycleItem('accessory',${i})" class="px-2 py-0.5 bg-red-900 hover:bg-red-800 rounded text-[10px] text-white">回收</button></div></div>`).join('') || '<span class="text-[10px] text-stone-500">无备用饰品</span>'}
                  </div>
                </div>
                <div class="bg-stone-900 p-3 rounded border border-stone-800 space-y-2">
                  <div class="font-bold text-amber-300">随身灵丹阁</div>
                  <div class="space-y-1.5 max-h-40 overflow-y-auto">
                    ${Object.keys(p.inventory.pills).map((pKey,i)=>{
                      const pill = PILLS_DATABASE[pKey];
                      const count = p.inventory.pills[pKey];
                      return `<div class="flex justify-between items-center bg-stone-950 p-1.5 rounded"><div><span class="${pill.tier.colorClass}">${pill.name}</span> <span class="text-[9px] text-amber-400">x${count}</span></div><div class="space-x-1"><button onclick="usePill('${pKey}')" class="px-2 py-0.5 bg-amber-800 hover:bg-amber-700 rounded text-[10px]">服用</button><button onclick="recycleItem('pill',${i})" class="px-2 py-0.5 bg-red-900 hover:bg-red-800 rounded text-[10px] text-white">回收</button></div></div>`;
                    }).join('') || '<span class="text-[10px] text-stone-500">无灵丹留存</span>'}
                  </div>
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-4 gap-3 text-xs pt-2">
                <div class="bg-stone-900 p-3 rounded border border-stone-800 space-y-2">
                  <div class="font-bold text-amber-300">未参悟秘籍功法 (${p.inventory.manualBooks.length})</div>
                  <div class="space-y-1.5 max-h-32 overflow-y-auto">
                    ${p.inventory.manualBooks.map((mb,i)=>`<div class="flex justify-between items-center bg-stone-950 p-1.5 rounded"><div><span class="${mb.tier.colorClass}">${mb.name}</span></div><button onclick="learnManualBook(${i})" class="px-2 py-0.5 bg-amber-800 hover:bg-amber-700 rounded text-[10px]">参悟</button></div>`).join('') || '<span class="text-[10px] text-stone-500">无多余功法书</span>'}
                  </div>
                </div>
                <div class="bg-stone-900 p-3 rounded border border-stone-800 space-y-2">
                  <div class="font-bold text-amber-300">未参悟杀伐武技 (${p.inventory.skillBooks.length})</div>
                  <div class="space-y-1.5 max-h-32 overflow-y-auto">
                    ${p.inventory.skillBooks.map((sb,i)=>`<div class="flex justify-between items-center bg-stone-950 p-1.5 rounded"><div><span class="${sb.tier.colorClass}">${sb.name}</span></div><button onclick="learnSkillBook(${i})" class="px-2 py-0.5 bg-amber-800 hover:bg-amber-700 rounded text-[10px]">参悟</button></div>`).join('') || '<span class="text-[10px] text-stone-500">无多余武技书</span>'}
                  </div>
                </div>
                <div class="bg-stone-900 p-3 rounded border border-stone-800 space-y-2">
                  <div class="font-bold text-amber-300">未研习技艺书 (${p.inventory.craftBooks.length})</div>
                  <div class="space-y-1.5 max-h-32 overflow-y-auto">
                    ${p.inventory.craftBooks.map((cb,i)=>`<div class="flex justify-between items-center bg-stone-950 p-1.5 rounded"><div><span class="text-amber-300">${cb.name}</span></div><button onclick="learnCraftBook(${i})" class="px-2 py-0.5 bg-amber-800 hover:bg-amber-700 rounded text-[10px]">研习</button></div>`).join('') || '<span class="text-[10px] text-stone-500">无多余技艺书</span>'}
                  </div>
                </div>
                <div class="bg-stone-900 p-3 rounded border border-stone-800 space-y-2">
                  <div class="font-bold text-amber-300">灵兽笼神兽 (${p.inventory.beasts.length})</div>
                  <div class="space-y-1.5 max-h-32 overflow-y-auto">
                    ${p.inventory.beasts.map((b,i)=>`<div class="flex justify-between items-center bg-stone-950 p-1.5 rounded"><div><span class="${b.tier.colorClass}">${b.name}</span> <span class="text-[9px] text-stone-400">(攻+${b.atk})</span></div><button onclick="deployBeast(${i})" class="px-2 py-0.5 bg-amber-800 hover:bg-amber-700 rounded text-[10px]">携带</button></div>`).join('') || '<span class="text-[10px] text-stone-500">无待携行神兽</span>'}
                  </div>
                </div>
              </div>
            </div>
          </div>`;
      } else if (gameState.mainTab === 'market') {
        const cat = gameState.marketFilterCat || 'all';
        const tier = gameState.marketFilterTier || 'all';
        const stock = (gameState.marketStock || []).filter(m => {
          if (cat !== 'all' && m.type !== cat) return false;
          if (tier !== 'all' && m.tier !== tier) return false;
          return true;
        });

        tabContent = `
          <div class="space-y-3">
            <div class="ink-panel p-3.5 rounded-xl border border-stone-800 flex flex-col sm:flex-row justify-between items-center text-xs gap-3">
              <div>
                <span class="font-bold text-amber-300 text-sm">🏬 大道坊市 (仙家珍宝斋)</span>
                <p class="text-[10px] text-stone-400 mt-0.5">精选10种奇珍，购完即空，自动过滤已拥有装备，消耗 100 灵石可刷新。</p>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                <select id="marketCat" onchange="gameState.marketFilterCat=this.value; renderStage();" class="bg-stone-900 border border-stone-700 rounded px-2 py-1 text-xs text-amber-200">
                  <option value="all" ${cat==='all'?'selected':''}>全品类</option>
                  <option value="weapon" ${cat==='weapon'?'selected':''}>武器</option>
                  <option value="armor" ${cat==='armor'?'selected':''}>护具</option>
                  <option value="accessory" ${cat==='accessory'?'selected':''}>饰品</option>
                  <option value="pill" ${cat==='pill'?'selected':''}>丹药</option>
                  <option value="beast" ${cat==='beast'?'selected':''}>神兽</option>
                  <option value="manualBook" ${cat==='manualBook'?'selected':''}>功法秘籍</option>
                  <option value="skillBook" ${cat==='skillBook'?'selected':''}>武技秘籍</option>
                  <option value="craftBook" ${cat==='craftBook'?'selected':''}>技艺技能书</option>
                </select>
                <select id="marketTier" onchange="gameState.marketFilterTier=this.value; renderStage();" class="bg-stone-900 border border-stone-700 rounded px-2 py-1 text-xs text-amber-200">
                  <option value="all" ${tier==='all'?'selected':''}>全等阶</option>
                  <option value="天阶" ${tier==='天阶'?'selected':''}>天阶</option>
                  <option value="地阶" ${tier==='地阶'?'selected':''}>地阶</option>
                  <option value="玄阶" ${tier==='玄阶'?'selected':''}>玄阶</option>
                  <option value="黄阶" ${tier==='黄阶'?'selected':''}>黄阶</option>
                </select>
                <span class="text-amber-400 font-bold">💎 灵石：${p.spiritStones}</span>
                <button onclick="refreshMarket()" class="px-3 py-1.5 bg-amber-900/80 hover:bg-amber-800 text-amber-200 rounded border border-amber-700 text-xs font-bold">🔄 刷新坊市 (100灵石)</button>
              </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-2.5">
              ${stock.map(m => {
                if (m.sold) {
                  return `<div class="ink-card p-3 rounded-xl opacity-40 flex flex-col justify-between text-xs bg-stone-950/40"><div class="text-stone-500 font-bold">【已售罄】</div><div class="text-[10px] text-stone-600 mt-2">被其他道友买走</div></div>`;
                }
                const tierClass = m.item.tier ? m.item.tier.colorClass : 'text-amber-300';
                const tierName = m.item.tier ? m.item.tier.name : '仙家传承';
                return `
                  <div class="ink-card p-3 rounded-xl flex flex-col justify-between text-xs space-y-2">
                    <div>
                      <div class="flex justify-between items-center mb-1"><span class="${tierClass} font-bold truncate">${m.item.name}</span><span class="text-[9px] px-1 py-0.5 rounded bg-stone-900 ${tierClass}">${tierName}</span></div>
                      <div class="text-[10px] text-stone-400 leading-tight">${m.item.desc || (m.item.atk ? `攻击+${m.item.atk} 防御+${m.item.def}` : (m.item.power ? `杀伐威力：${m.item.power}` : '珍稀修真造化'))}</div>
                    </div>
                    <div class="flex justify-between items-center pt-2 border-t border-stone-800">
                      <span class="text-amber-400 font-bold">💎 ${m.price}</span>
                      <button onclick="buyMarketItem('${m.id}')" class="px-2.5 py-1 bg-amber-700 hover:bg-amber-600 text-white font-bold rounded text-[11px]">购置</button>
                    </div>
                  </div>`;
              }).join('')}
            </div>
          </div>`;
      }

      const curRank = p.sectRank || '外门弟子';
      app.innerHTML = `
        <div class="ink-panel p-3 rounded-xl border border-stone-800 mb-3 text-xs grid grid-cols-2 sm:grid-cols-5 gap-2 text-center">
          <div><div class="text-stone-500">境界</div><div class="text-amber-300 font-bold">${cur.name}</div></div>
          <div><div class="text-stone-500">职务</div><div class="text-amber-200 font-bold">${curRank}</div></div>
          <div><div class="text-stone-500">气血 / 法力</div><div class="text-emerald-400 font-bold">${p.hp}/${stats.maxHp} | ${p.mp}/${stats.maxMp}</div></div>
          <div><div class="text-stone-500">寿元 / 大限</div><div class="text-stone-300 font-bold">${p.age} / ${maxAge} 岁</div></div>
          <div><div class="text-stone-500">灵石盘缠</div><div class="text-amber-400 font-bold">💎 ${p.spiritStones}</div></div>
        </div>
        <div class="flex border-b border-stone-800 mb-3 text-xs overflow-x-auto space-x-1">
          <button onclick="switchTab('home')" class="px-3.5 py-2 rounded-t-lg transition ${gameState.mainTab==='home'?'bg-stone-800 text-amber-300 font-bold border-t border-x border-stone-700':'text-stone-400 hover:text-stone-200'}">🧘 洞府修真</button>
          <button onclick="switchTab('attributes')" class="px-3.5 py-2 rounded-t-lg transition ${gameState.mainTab==='attributes'?'bg-stone-800 text-amber-300 font-bold border-t border-x border-stone-700':'text-stone-400 hover:text-stone-200'}">👤 道骨真元</button>
          <button onclick="switchTab('skills_tab')" class="px-3.5 py-2 rounded-t-lg transition ${gameState.mainTab==='skills_tab'?'bg-stone-800 text-amber-300 font-bold border-t border-x border-stone-700':'text-stone-400 hover:text-stone-200'}">📖 功法武技</button>
          <button onclick="switchTab('crafts')" class="px-3.5 py-2 rounded-t-lg transition ${gameState.mainTab==='crafts'?'bg-stone-800 text-amber-300 font-bold border-t border-x border-stone-700':'text-stone-400 hover:text-stone-200'}">⚗️ 修仙百艺</button>
          <button onclick="switchTab('equip')" class="px-3.5 py-2 rounded-t-lg transition ${gameState.mainTab==='equip'?'bg-stone-800 text-amber-300 font-bold border-t border-x border-stone-700':'text-stone-400 hover:text-stone-200'}">🎒 百宝神兵</button>
          <button onclick="switchTab('market')" class="px-3.5 py-2 rounded-t-lg transition ${gameState.mainTab==='market'?'bg-stone-800 text-amber-300 font-bold border-t border-x border-stone-700':'text-stone-400 hover:text-stone-200'}">🏬 大道坊市</button>
        </div>
        ${tabContent}`;
    }

    function equipItem(type, idx) {
      const p = gameState.player;
      if (type === 'weapon') {
        if (p.equipWeapons.length >= 2) { showModal("槽位已满", "神兵武器最多同时佩戴 2 件！"); return; }
        const item = p.inventory.weapons.splice(idx, 1)[0];
        p.equipWeapons.push(item);
      } else if (type === 'armor') {
        if (p.equipArmors.length >= 2) { showModal("槽位已满", "护体道甲最多同时装备 2 件！"); return; }
        const item = p.inventory.armors.splice(idx, 1)[0];
        p.equipArmors.push(item);
      } else if (type === 'accessory') {
        if (p.equipAccessories.length >= 10) { showModal("槽位已满", "通灵佩饰最多同时佩戴 10 件！"); return; }
        const item = p.inventory.accessories.splice(idx, 1)[0];
        p.equipAccessories.push(item);
      }
      renderStage();
    }

    function deployBeast(idx) {
      const p = gameState.player;
      if (p.equipBeasts.length >= 2) { showModal("槽位已满", "随行神兽最多同时携带 2 头！"); return; }
      const beast = p.inventory.beasts.splice(idx, 1)[0];
      p.equipBeasts.push(beast);
      renderStage();
    }

    function unequipItem(type, idx) {
      const p = gameState.player;
      if (type === 'weapon') {
        const item = p.equipWeapons.splice(idx, 1)[0];
        p.inventory.weapons.push(item);
      } else if (type === 'armor') {
        const item = p.equipArmors.splice(idx, 1)[0];
        p.inventory.armors.push(item);
      } else if (type === 'accessory') {
        const item = p.equipAccessories.splice(idx, 1)[0];
        p.inventory.accessories.push(item);
      } else if (type === 'beast') {
        const item = p.equipBeasts.splice(idx, 1)[0];
        p.inventory.beasts.push(item);
      }
      renderStage();
    }

    window.onload = function() {
      if (!loadGame()) initRootsStage(); else renderStage();
    };
  </script>
</body>
</html>
